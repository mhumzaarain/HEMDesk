services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmms}
      POSTGRES_USER: ${POSTGRES_USER:-cmms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/mhumzaarain/hemdesk:${IMAGE_TAG:-latest}
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/mhumzaarain/hemdesk:${IMAGE_TAG:-latest}
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py procrastinate worker
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - staticfiles:/staticfiles:ro
    depends_on:
      - web

  ollama:
    image: ollama/ollama:latest
    environment:
      # Keep models resident in RAM. The default unloads after 5 idle
      # minutes, and a CPU box pays a 20-60s reload on the next request —
      # which alone can blow the interactive chat timeout.
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama:/root/.ollama

  ollama-init:
    # One-shot: pulls the chat + embedding models into the shared volume,
    # then exits. Idempotent — cached models make re-runs near-instant.
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${LLM_MODEL:-llama3.2:3b} && ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}"]
    restart: "no"
    deploy:
      # Swarm equivalent of restart:no — without it, `docker stack deploy`
      # would endlessly restart this exited one-shot.
      restart_policy:
        condition: none

volumes:
  pgdata:
  staticfiles:
  ollama:
  media:

configs:
  nginx_conf:
    file: ./nginx.conf
