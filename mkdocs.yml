site_name: HEMDesk Documentation
site_description: User and developer documentation for the Biomedical CMMS
site_url: https://mhumzaarain.github.io/Hospital-Medical-Equipment-Management-System-Biomedical-CMMS-/
repo_url: https://github.com/mhumzaarain/Hospital-Medical-Equipment-Management-System-Biomedical-CMMS-
repo_name: GitHub

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  superpowers/
  FOLLOWUPS.md

nav:
  - Home: index.md
  - Getting Started:
      - Logging in & roles: getting-started/logging-in.md
      - A tour of the app: getting-started/tour.md
  - Equipment:
      - Browse & search: equipment/browse-and-search.md
      - Register equipment: equipment/register.md
      - Edit & condemn: equipment/edit-and-condemn.md
      - Import from Excel or CSV: equipment/import.md
      - Accessories & stock: equipment/accessories.md
      - Accessory faults & replacement: equipment/accessory-faults.md
  - Complaints & Repairs:
      - Lodge a complaint: complaints/lodge.md
      - Track & confirm resolution: complaints/track-and-confirm.md
      - The complaint queue: complaints/queue.md
      - Work orders: complaints/work-orders.md
  - Preventive Maintenance:
      - PPM schedules: ppm/schedules.md
      - Completing due PPMs: ppm/completing.md
  - Dashboard & Reports:
      - Reading the dashboard: dashboard-reports/dashboard.md
      - Monthly reports: dashboard-reports/reports.md
  - Administration:
      - Managing user accounts: admin/user-accounts.md
  - Developer:
      - Architecture overview: developer/architecture.md
      - Data model: developer/data-model.md
      - Setup & contributing: developer/setup.md
