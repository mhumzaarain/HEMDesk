name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cmms
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Run test suite
        run: uv run pytest -q
        env:
          POSTGRES_HOST: localhost

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose layerings
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
      - name: Production services resolve to the published image
        run: |
          unset IMAGE_TAG
          grep -v '^IMAGE_TAG=' .env > .env.no-image-tag
          docker compose --env-file .env.no-image-tag -f docker-compose.yml -f docker-compose.prod.yml config \
            | grep -q "image: ghcr.io/mhumzaarain/hemdesk:latest"
          IMAGE_TAG=1.2.0 docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
            | grep -q "image: ghcr.io/mhumzaarain/hemdesk:1.2.0"
