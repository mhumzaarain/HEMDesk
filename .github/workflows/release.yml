name: Release

# Version tags publish an image; pushes to main publish nothing.
#     git tag v1.2.0 && git push origin v1.2.0
# Tag a commit that is already on main — CI has gated it there, so this
# workflow does not re-run the test suite.
on:
  push:
    tags: ["v*"]

# Grants the run's automatic GITHUB_TOKEN permission to push to GHCR. No
# personal access token is created, stored, or rotated.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase — GHCR rejects the repository's "HEMDesk" spelling.
          images: ghcr.io/mhumzaarain/hemdesk
          # {{version}} drops the leading v, so v1.2.0 publishes 1.2.0. The
          # default flavour also moves latest to the newest release. The
          # action records the repository URL on the image, which is what
          # lists the package under the repository.
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # GitHub's runners are x86-64. ARM nodes build locally instead.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
